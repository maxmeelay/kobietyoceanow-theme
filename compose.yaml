name: kobietyoceanow-theme

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD: ${DB_PASSWORD:-local-wordpress-password}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local-root-password}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LOCAL_PORT:-8081}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-local-wordpress-password}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-f4uu_}
    volumes:
      - wordpress_data:/var/www/html
      - ${KO_DATA_DIR:-/home/dev/.local/share/kobietyoceanow}/uploads:/var/www/html/wp-content/uploads
      - ${KO_DATA_DIR:-/home/dev/.local/share/kobietyoceanow}/plugins:/var/www/html/wp-content/plugins
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/wp-includes/version.php && php -r '$$s=@fsockopen(\"127.0.0.1\",80); exit($$s ? 0 : 1);'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-local-wordpress-password}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-f4uu_}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${LOCAL_SITE_URL:-http://tower-3420:8081}');
        define('WP_SITEURL', '${LOCAL_SITE_URL:-http://tower-3420:8081}');
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG', true);
    volumes:
      - wordpress_data:/var/www/html
      - ${KO_DATA_DIR:-/home/dev/.local/share/kobietyoceanow}/uploads:/var/www/html/wp-content/uploads
      - ${KO_DATA_DIR:-/home/dev/.local/share/kobietyoceanow}/plugins:/var/www/html/wp-content/plugins
    working_dir: /var/www/html
    entrypoint: ["wp"]

volumes:
  wordpress_data:
  db_data:
