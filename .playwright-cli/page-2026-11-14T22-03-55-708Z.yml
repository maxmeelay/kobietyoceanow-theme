            - paragraph [ref=f1e469]: Wokół Fundacji Kobiety Oceanów spotykają się osoby z różnych środowisk, które łączy wspólna idea – wiara, że warto odważnie marzyć, podejmować wyzwania i wspierać innych w odkrywaniu własnych możliwości.
