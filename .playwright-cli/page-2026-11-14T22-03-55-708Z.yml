        - generic [ref=f1e170]:
          - paragraph [ref=f1e171]: O Nas
          - heading "Kobiety Oceanów" [level=2] [ref=f1e172]
          - paragraph [ref=f1e173]: Fundacja Kobiety Oceanów im. Krystyny Chojnowskiej-Liskiewicz powstała z przekonania, że warto odważnie marzyć, a dzięki determinacji, konsekwencji i dobremu przygotowaniu można realizować nawet najbardziej ambitne cele.
          - paragraph [ref=f1e174]: Przypominając historię naszej Patronki, inspirujemy kolejne pokolenia do odważnego podejmowania wyzwań i odkrywania własnych możliwości poprzez żeglarstwo, edukację i działania społeczne.
          - paragraph [ref=f1e175]:
            - strong [ref=f1e176]: Każda z nas przeszła inną drogę. Wszystkie spotkałyśmy się w jednym miejscu – tam, gdzie historia stała się inspiracją do działania.
          - link "Poznaj Fundacje" [ref=f1e177] [cursor=pointer]:
            - /url: /o-nas/
