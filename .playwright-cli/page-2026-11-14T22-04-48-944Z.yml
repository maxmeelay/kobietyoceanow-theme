        - generic [ref=f3e204]:
          - paragraph [ref=f3e205]: O Nas
          - heading "Kobiety Oceanów" [level=2] [ref=f3e206]
          - paragraph [ref=f3e207]: Fundacja Kobiety Oceanów im. Krystyny Chojnowskiej-Liskiewicz powstała z przekonania, że warto odważnie marzyć, a dzięki determinacji, konsekwencji i dobremu przygotowaniu można realizować nawet najbardziej ambitne cele.
          - paragraph [ref=f3e208]: Przypominając historię naszej Patronki, inspirujemy kolejne pokolenia do odważnego podejmowania wyzwań i odkrywania własnych możliwości poprzez żeglarstwo, edukację i działania społeczne.
          - paragraph [ref=f3e209]:
            - strong [ref=f3e210]: Każda z nas przeszła inną drogę. Wszystkie spotkałyśmy się w jednym miejscu – tam, gdzie historia stała się inspiracją do działania.
          - link "Poznaj Fundacje" [ref=f3e211] [cursor=pointer]:
            - /url: /o-nas/
