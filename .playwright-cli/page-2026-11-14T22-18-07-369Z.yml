          - generic [ref=e190]:
            - paragraph [ref=e191]: Our patron
            - heading "The woman who changed history." [level=2] [ref=e192]
            - paragraph [ref=e193]: On 20 March 1978 at 19:00 yacht time (21:00 GMT), Captain Krystyna Chojnowska-Liskiewicz completed 28,696 nautical miles and closed the loop around the globe, becoming the first woman in the world to achieve this feat.
            - paragraph [ref=e194]: Her story shows how courage, determination, consistency and careful preparation can make even the most ambitious goals possible.
            - paragraph [ref=e195]: To this day, she inspires new generations to take on bold challenges.
            - link "Meet our patron" [ref=e196] [cursor=pointer]:
              - /url: /historia-krystyny-chojnowskiej-liskiewicz/
        - text: \n
        - generic [ref=e202]:
          - paragraph [ref=e203]: About us
          - heading "Women of the Oceans" [level=2] [ref=e204]
          - paragraph [ref=e205]: The Krystyna Chojnowska-Liskiewicz Women of the Oceans Foundation was founded on the belief that bold dreams can be achieved through determination, consistency and careful preparation.
          - paragraph [ref=e206]: By sharing our patron’s story, we inspire new generations to take on challenges and discover their potential through sailing, education and community work.
          - paragraph [ref=e207]:
            - strong [ref=e208]: Each of us has followed a different path. We met where history became an inspiration to act.
          - link "Meet the Foundation" [ref=e209] [cursor=pointer]:
            - /url: /#o-nas
