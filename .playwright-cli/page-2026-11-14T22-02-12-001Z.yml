        - generic [ref=e170]:
          - paragraph [ref=e171]: O Nas
          - heading "Kobiety Oceanów" [level=2] [ref=e172]
          - paragraph [ref=e173]: Fundacja Kobiety Oceanów im. Krystyny Chojnowskiej-Liskiewicz powstała z przekonania, że warto odważnie marzyć, a dzięki determinacji, konsekwencji i dobremu przygotowaniu można realizować nawet najbardziej ambitne cele.
          - paragraph [ref=e174]: Przypominając historię naszej Patronki, inspirujemy kolejne pokolenia do odważnego podejmowania wyzwań i odkrywania własnych możliwości poprzez żeglarstwo, edukację i działania społeczne.
          - paragraph [ref=e175]:
            - strong [ref=e176]: Każda z nas przeszła inną drogę. Wszystkie spotkałyśmy się w jednym miejscu – tam, gdzie historia stała się inspiracją do działania.
          - link "Poznaj Fundacje" [ref=e177] [cursor=pointer]:
            - /url: /o-nas/
