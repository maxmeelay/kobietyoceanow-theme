          - generic [ref=e156]:
            - generic [ref=e157]: O patronce
            - heading "Kobieta, która zmieniła historię." [level=2] [ref=e158]
            - paragraph [ref=e159]: 20 marca 1978 roku o godzinie 19:00 czasu jachtowego (21:00 GMT) inż. kpt. Krystyna Chojnowska-Liskiewicz po przepłynięciu 28 696 mil morskich zamknęła pętlę wokół globu, stając się pierwszą kobietą na świecie, która dokonała tego wyczynu.
            - paragraph [ref=e160]: Jej historia pokazuje, że odwaga, determinacja, konsekwencja i odpowiednie przygotowanie pozwalają osiągać nawet najbardziej ambitne cele.
            - paragraph [ref=e161]: Do dziś inspiruje kolejne pokolenia do odważnego podejmowania wyzwań.
            - link "Poznaj Patronkę" [ref=e162] [cursor=pointer]:
